<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="艾林翰书斋 · 双语阅读 — 七篇短篇全译与四部长篇开卷的英汉逐段对照读本">
<meta name="theme-color" content="#14231b">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<title>双语阅读 · 艾林翰书斋</title>
<style>
@font-face{font-family:'CrimsonPro';src:url('./_shared/fonts/CrimsonPro-Regular.ttf') format('truetype');font-weight:400;font-display:swap}
@font-face{font-family:'CrimsonPro';src:url('./_shared/fonts/CrimsonPro-Bold.ttf') format('truetype');font-weight:700;font-display:swap}
@font-face{font-family:'CrimsonPro';src:url('./_shared/fonts/CrimsonPro-Italic.ttf') format('truetype');font-weight:400;font-style:italic;font-display:swap}
@font-face{font-family:'Lora';src:url('./_shared/fonts/Lora-Regular.ttf') format('truetype');font-weight:400;font-display:swap}
@font-face{font-family:'Lora';src:url('./_shared/fonts/Lora-Bold.ttf') format('truetype');font-weight:700;font-display:swap}
@font-face{font-family:'JBMono';src:url('./_shared/fonts/JetBrainsMono-Regular.ttf') format('truetype');font-weight:400;font-display:swap}

:root{
  --ink:#e9e4d6; --ink-dim:#b9b2a0; --ink-faint:#8a8474;
  --bg:#14231b; --bg2:#0e1a14; --bg3:#1b2e24; --line:#2d4436;
  --gold:#d9a862; --gold-soft:#b98c4f; --amber:#e8c07a;
  --accent:#7fae8e;
  --serif:'CrimsonPro',Georgia,serif; --body:'Lora',Georgia,serif; --mono:'JBMono',Consolas,monospace;
  --fs:17px; --fs-en:16px;
}
html[data-theme=paper]{--ink:#332f26;--ink-dim:#5b554a;--ink-faint:#857d6d;--bg:#f4eddc;--bg2:#ece2ca;--bg3:#efe7d4;--line:#d8cbaa;--gold:#8a6420;--gold-soft:#a5792f;--amber:#7d5a1a;--accent:#48705a}
html[data-theme=light]{--ink:#27251f;--ink-dim:#55524a;--ink-faint:#8a8474;--bg:#faf8f3;--bg2:#f1eee5;--bg3:#ffffff;--line:#ddd8c8;--gold:#8a6420;--gold-soft:#a5792f;--amber:#7d5a1a;--accent:#48705a}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:var(--fs);-webkit-font-smoothing:antialiased}
a{color:var(--amber)}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
::selection{background:var(--gold);color:#14231b}
.hidden{display:none!important}

/* ===== 顶栏 ===== */
.topbar{position:fixed;top:0;left:0;right:0;z-index:50;height:56px;display:flex;align-items:center;gap:12px;padding:0 18px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topbar .back{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--accent);white-space:nowrap}
.topbar .back:hover{color:var(--amber)}
.topbar .bt{font-family:var(--serif);font-weight:700;font-size:16px;letter-spacing:.05em;color:var(--amber);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.modes{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--bg3);flex:none}
.modes button{padding:6px 11px;font-size:12px;color:var(--ink-faint);border-right:1px solid var(--line);transition:.15s;white-space:nowrap}
.modes button:last-child{border-right:none}
.modes button:hover{color:var(--amber)}
.modes button.on{background:var(--gold);color:#14231b;font-weight:700}

/* ===== 选书页 ===== */
#view-pick{padding-top:56px;max-width:860px;margin:0 auto;padding-left:20px;padding-right:20px}
.pick-head{padding:56px 0 14px;text-align:center}
.pick-head .era{font-family:var(--mono);font-size:10.5px;letter-spacing:.34em;color:var(--gold-soft);text-transform:uppercase;margin-bottom:16px}
.pick-head h1{font-family:var(--serif);font-size:clamp(30px,5vw,46px);font-weight:700;line-height:1.15}
.pick-head h1 em{color:var(--amber);font-style:italic}
.pick-head .sub{font-size:14px;color:var(--ink-dim);margin-top:14px;line-height:1.9;max-width:560px;margin-left:auto;margin-right:auto}
.pick-note{margin:26px auto 34px;max-width:640px;border:1px dashed var(--line);border-radius:12px;padding:15px 20px;font-size:13px;line-height:1.9;color:var(--ink-faint);background:var(--bg3)}
.pick-note b{color:var(--gold)}
.pick-list{display:grid;gap:16px;padding-bottom:70px}
.pcard{position:relative;border:1px solid var(--line);border-radius:15px;background:var(--bg3);padding:22px 24px 20px;cursor:pointer;transition:.2s;overflow:hidden;display:block;text-decoration:none}
.pcard:hover{border-color:var(--gold-soft);transform:translateY(-3px);box-shadow:0 12px 34px rgba(0,0,0,.28)}
.pcard .yr{position:absolute;top:16px;right:18px;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--gold-soft);border:1px solid var(--line);border-radius:6px;padding:2.5px 8px;background:var(--bg)}
.pcard .ten{font-family:var(--serif);font-size:22px;font-weight:700;line-height:1.3;color:var(--ink);margin-bottom:4px;padding-right:70px}
.pcard .tzh{font-family:var(--serif);font-size:15px;color:var(--amber);letter-spacing:.12em;margin-bottom:12px}
.pcard .td{font-size:13.5px;line-height:1.85;color:var(--ink-dim)}
.pcard .tf{display:flex;gap:8px;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);align-items:center}
.pcard .tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--ink-faint);text-transform:uppercase;border:1px solid var(--line);border-radius:5px;padding:2px 8px}
.pcard .go{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--gold-soft)}

/* ===== 阅读视图 ===== */
#view-read{padding-top:56px;display:none}
.rwrap{max-width:780px;margin:0 auto;padding:42px 26px 30px}
.rhead{text-align:center;margin-bottom:38px}
.rhead .rt{font-family:var(--serif);font-size:clamp(26px,4vw,36px);font-weight:700;color:var(--amber);line-height:1.25}
.rhead .rst{font-family:var(--serif);font-style:italic;font-size:16px;color:var(--ink-faint);margin-top:8px}
.rhead .rz{font-size:14px;color:var(--ink-dim);margin-top:6px;letter-spacing:.2em}
.rhead .meta{display:flex;justify-content:center;gap:18px;margin-top:14px;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--gold-soft);text-transform:uppercase}
.rhead .rule{width:70px;height:1px;background:var(--gold-soft);margin:22px auto 0}
.trans-note{margin:0 0 34px;font-size:12.5px;line-height:1.9;color:var(--ink-faint);border:1px dashed var(--line);border-radius:10px;padding:11px 16px;background:var(--bg3);text-align:center}
.trans-note b{color:var(--gold)}

/* ===== 双语段落 —— 四模式统一采用正规对照读本排版：无底色块、无侧边条、双语同权 ===== */
#content{font-size:var(--fs);line-height:1.85}
.seg{margin:0 0 1.35em}
.seg .zh{font-family:var(--body),'Microsoft YaHei','PingFang SC',serif;font-size:var(--fs);line-height:2.0;color:var(--ink);text-align:justify}
.seg .en{font-family:var(--serif);font-size:var(--fs-en);line-height:1.8;color:var(--ink);text-align:justify}
.seg .en em{font-style:italic;color:var(--amber)}
.seg .scene{margin:1.4em auto;text-align:center;color:var(--gold-soft);letter-spacing:.6em;text-indent:.6em;font-size:12px}

/* 双语：中上英下（中文优先读本），语言间细线分隔 */
body.mode-bi .seg{display:flex;flex-direction:column;margin-bottom:1.35em}
body.mode-bi .seg .zh{order:1;padding:0 0 .7em;margin-bottom:0;border-bottom:1px solid var(--line)}
body.mode-bi .seg .en{order:2;padding:.65em .2em 0}
body.mode-bi .seg .scene{order:0}

/* 仅英：英文小说排版 —— 首行缩进、两端对齐、自动断词（场景切换后首段不缩进） */
body.mode-en .seg .zh{display:none}
body.mode-en .seg{margin-bottom:0}
body.mode-en .seg .en{font-size:var(--fs);line-height:1.9;padding:0;margin-bottom:.5em;text-indent:1.5em;hyphens:auto;-webkit-hyphens:auto}
body.mode-en .seg:first-child .en,
body.mode-en .seg:has(.scene)+.seg .en{text-indent:0}

/* 仅中：中文书籍排版 —— 通篇首行缩进两字符 */
body.mode-zh .seg .en{display:none}
body.mode-zh .seg{margin-bottom:0}
body.mode-zh .seg .zh{padding:0;margin-bottom:.12em;text-indent:2em}

/* 穿插：英上中下（英文优先读本），语言间细线分隔 */
body.mode-inter .seg{display:flex;flex-direction:column;margin-bottom:1.15em}
body.mode-inter .seg .en{order:1;padding:0 0 .7em;border-bottom:1px solid var(--line);margin-bottom:0}
body.mode-inter .seg .zh{order:2;padding:.6em 0 0;margin-bottom:0}
body.mode-inter .seg .scene{order:0}

/* ===== TTS ===== */
.tts-on{background:color-mix(in srgb,var(--gold) 30%,transparent);color:var(--ink);border-radius:3px;box-shadow:0 0 0 2px color-mix(in srgb,var(--gold) 30%,transparent)}
body.tts-reading #content .seg .en,body.tts-reading #content .seg .zh{color:var(--ink-faint)}
body.tts-reading #content .seg:has(.tts-on) .en,body.tts-reading #content .seg:has(.tts-on) .zh{color:var(--ink)}
#ttsbar{position:fixed;left:50%;bottom:22px;transform:translate(-50%,140%);z-index:60;display:flex;align-items:center;gap:8px;padding:9px 14px;background:color-mix(in srgb,var(--bg2) 94%,transparent);border:1px solid var(--line);border-radius:13px;backdrop-filter:blur(12px);transition:.25s;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#ttsbar.show{transform:translate(-50%,0)}
#ttsbar .prog{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);min-width:64px;text-align:center}
#ttsbar select{background:var(--bg);color:var(--ink-dim);border:1px solid var(--line);border-radius:7px;font-size:11.5px;padding:4px 6px;font-family:var(--mono);max-width:150px}
.tbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:6px 11px;border:1px solid var(--line);border-radius:8px;font-size:13px;color:var(--ink-dim);background:var(--bg3);transition:.15s}
.tbtn:hover{color:var(--amber);border-color:var(--gold-soft)}
.tbtn.mini{padding:5px 9px;font-size:12px}
.tbtn.on{color:#14231b;background:var(--gold);border-color:var(--gold);font-weight:700}

/* ===== 工具条 ===== */
#tools{position:fixed;right:18px;bottom:22px;z-index:55;display:flex;flex-direction:column;gap:8px}
#tools .tbtn{width:40px;height:40px;border-radius:11px;background:var(--bg3)}
#fontpanel{position:fixed;right:68px;bottom:22px;z-index:55;background:var(--bg2);border:1px solid var(--line);border-radius:13px;padding:14px 16px;display:none;min-width:200px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#fontpanel.open{display:block}
#fontpanel .fl{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--gold-soft);text-transform:uppercase;margin-bottom:8px}
#fontpanel .row{display:flex;gap:6px;margin-bottom:12px}
#fontpanel .chip{padding:5px 10px;border:1px solid var(--line);border-radius:7px;font-size:12px;color:var(--ink-dim);background:var(--bg)}
#fontpanel .chip.on{background:var(--gold);color:#14231b;font-weight:700;border-color:var(--gold)}
.foot{margin:60px 0 50px;padding-top:26px;border-top:1px solid var(--line);font-size:12.5px;line-height:2;color:var(--ink-faint);text-align:center}
.foot b{color:var(--ink-dim)}
.loading{text-align:center;padding:90px 20px;color:var(--ink-faint);font-style:italic}
.toast{position:fixed;left:50%;top:74px;transform:translateX(-50%);z-index:99;background:var(--gold);color:#14231b;font-size:13px;font-weight:700;padding:9px 18px;border-radius:9px;opacity:0;transition:.25s;pointer-events:none;letter-spacing:.05em}
.toast.show{opacity:1}

@media(max-width:700px){
  .topbar{gap:8px;padding:0 10px}
  .topbar .bt{font-size:14px}
  .modes button{padding:5px 7px;font-size:11px}
  .rwrap{padding:30px 16px 20px}
  #ttsbar{left:12px;right:12px;transform:translate(0,140%);flex-wrap:wrap;justify-content:center}
  #ttsbar.show{transform:translate(0,0)}
  #tools{right:12px;bottom:14px}
  #fontpanel{right:60px;bottom:14px}
}
@media print{.topbar,#ttsbar,#tools,#fontpanel,.mtools{display:none!important}}
</style>
</head>

/* ===== 状态 ===== */
let CUR=null;            // 当前书对象
let PAIRS=[];            // [{en,zh}]
let MODE='bi';
const store={
  get(k,d){try{const v=localStorage.getItem('alm-bi-'+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem('alm-bi-'+k,JSON.stringify(v))}catch(e){}}
};
let CFG=store.get('cfg',{fs:17,theme:'dark'});
let PROG=store.get('prog',{});
let ttsLang=store.get('ttslang','auto');

/* ===== toast ===== */
let toastTimer=null;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2200)}

/* ===== 文本提取 ===== */
function parasOf(text){
  return text.split(/\n\s*\n/).map(p=>p.replace(/\s*\n\s*/g,' ').trim()).filter(p=>p.length>0);
}
function extractEN(text,book){
  const i=text.indexOf(book.enStart);
  if(i<0)return null;
  const rest=text.slice(i);
  const m=rest.match(book.enEnd);
  const end=m?(m.index+m[0].length):rest.length;
  let seg=rest.slice(0,end);
  /* 去掉行首连载页眉（如 GHOSTS / AT HOME / THE SPOOR） */
  seg=seg.replace(/^[A-Z][A-Z ]{3,}\s{2,}/,'');
  return parasOf(seg);
}
function extractZH(text,book){
  let ps=parasOf(text);
  ps=ps.slice(book.zhSkip);
  /* 去掉尾部〔…完〕标记 */
  while(ps.length&&/^\[|^〔/.test(ps[ps.length-1]))ps.pop();
  return ps;
}
function fmt(p){
  const e=esc(p);
  return e.replace(/_(.+?)_/g,'<em>$1</em>');
}
function isScene(p){return /^[\s\*＊]+$/.test(p)||/^\*\s*\*\s*\*/.test(p)||/^[＊]/.test(p)}

/* ===== 渲染 ===== */
function renderPick(){
  const list=$('#pick-list');
  list.innerHTML=BOOKS.map(b=>`
    <a class="pcard" href="#${b.id}">
      <span class="yr">${b.year}</span>
      <div class="ten">${esc(b.title)}</div>
      <div class="tzh">${esc(b.zh)}</div>
      <div class="td">${esc(b.desc)}</div>
      <div class="tf">
        <span class="tag">${b.scope}</span>
        <span class="tag">Bilingual</span>
        <span class="go">开始阅读 →</span>
      </div>
    </a>`).join('');
  $$('.pcard').forEach(c=>c.addEventListener('click',e=>{e.preventDefault();location.hash=c.getAttribute('href').slice(1)}));
}

function renderBook(book){
  $('#content').innerHTML='<div class="loading">正在加载双语内容…</div>';
  Promise.all([
    fetch(book.enFile).then(r=>{if(!r.ok)throw new Error('英文原文加载失败');return r.text()}),
    fetch(book.zhFile).then(r=>{if(!r.ok)throw new Error('中文译文加载失败');return r.text()})
  ]).then(([enText,zhText])=>{
    const en=extractEN(enText,book), zh=extractZH(zhText,book);
    if(!en)throw new Error('未能在原文中定位选段');
    if(en.length!==zh.length){
      throw new Error('中英段落未对齐（英 '+en.length+' 段 / 中 '+zh.length+' 段）');
    }
    PAIRS=en.map((p,i)=>({en:p,zh:zh[i]}));
    book.pairs=PAIRS;
    paint(book);
  }).catch(err=>{
    $('#content').innerHTML='<div class="loading">加载失败：'+esc(err.message)+'</div>';
  });
}

function paint(book){
  $('#r-title').textContent=book.title;
  $('#r-sub').textContent=book.sub;
  $('#r-zh').textContent=book.zh;
  $('#m-year').textContent=book.year;
  $('#m-scope').textContent=book.scope;
  $('#trans-note').innerHTML='<b>'+esc(book.note)+'</b> · 中文译文由本站译出，仅供学习交流';
  $('#bt-title').textContent=book.title+' · '+book.zh;
  const st=PROG[book.id];
  $('#read-foot').innerHTML='<b>'+esc(book.title)+'</b> · 艾林翰书斋 双语阅读 · '
    +'<a href="./index.html#book/'+book.reader+'">前往全书阅读器 →</a>'
    +(st?'<br>上次读到第 '+(st.seg+1)+' 段（'+Math.round(st.pct*100)+'%）':'');
  let html='';
  PAIRS.forEach((p,i)=>{
    if(isScene(p.en)||isScene(p.zh)){
      html+='<div class="seg"><div class="scene">＊　＊　＊</div></div>';
      return;
    }
    html+='<div class="seg" data-i="'+i+'"><div class="zh">'+fmt(p.zh)+'</div><div class="en" lang="en">'+fmt(p.en)+'</div></div>';
  });
  $('#content').innerHTML=html;
  document.body.className='mode-'+MODE;
  $('#modes').style.display='flex';
  /* 恢复进度 */
  if(st&&st.seg>0&&st.seg<PAIRS.length){
    const el=$('#content .seg[data-i="'+st.seg+'"]');
    if(el)setTimeout(()=>el.scrollIntoView({block:'start'}),60);
  }
  saveProg(0);
}

function saveProg(seg){
  if(!CUR)return;
  const doc=document.documentElement;
  const pct=Math.min(1,window.scrollY/Math.max(1,doc.scrollHeight-window.innerHeight));
  const old=PROG[CUR.id]||{seg:0,pct:0};
  PROG[CUR.id]={seg:Math.max(old.seg,seg),pct:Math.max(old.pct,pct)};
  store.set('prog',PROG);
}

/* ===== 模式切换 ===== */
$$('#modes button').forEach(b=>b.addEventListener('click',()=>{
  MODE=b.dataset.mode;
  $$('#modes button').forEach(x=>x.classList.toggle('on',x===b));
  document.body.className='mode-'+MODE+(tts.on?' tts-reading':'');
  if(tts.on){tts.stopAll()}
}));

/* ===== TTS 引擎 ===== */
const tts={
  on:false,paused:false,idx:0,sents:[],els:[],
  lang(){
    if(ttsLang!=='auto')return ttsLang;
    return MODE==='zh'?'zh':'en';
  },
  refresh(){
    if(this.on)this.stopAll();
    this.sents=[];this.els=[];
    const zh=this.lang()==='zh';
    $$('#content .seg').forEach(seg=>{
      seg.querySelectorAll('.snt').forEach(s=>s.remove());
      const target=zh?seg.querySelector('.zh'):seg.querySelector('.en');
      if(!target)return;
      const text=target.textContent;
      const parts=zh?this.splitZh(text):this.splitEn(text);
      target.innerHTML=parts.map(s=>'<span class="snt">'+esc(s)+'</span>').join(' ');
      Array.from(target.querySelectorAll('.snt')).forEach(el=>{
        this.sents.push(el.textContent);this.els.push(el);
      });
    });
  },
  splitEn(text){
    const out=[];let buf='';
    const n=text.length;
    for(let i=0;i<n;i++){
      const c=text[i];
      buf+=c;
      if('.!?…'.includes(c)){
        let j=i+1;
        while(j<n&&'"\u201D\u2019\')'.includes(text[j])){buf+=text[j];j++;i++}
        const tail=buf.trim();
        if(/\b(Mr|Mrs|Dr|St|Prof|Esq|No|vs|etc|Jr|Sr|Lt|Col|Gen|Capt|Rev|Hon|Fr|Mt)\.$/.test(tail)&&i+1<n&&text[i+1]!==' ')continue;
        if(buf.trim().length>1)out.push(buf.trim());
        buf='';
      }
    }
    if(buf.trim())out.push(buf.trim());
    return out.length?out:[text];
  },
  splitZh(text){
    const out=[];let buf='';
    for(const c of text){
      buf+=c;
      if('。！？；…'.includes(c)&&buf.trim().length>1){out.push(buf.trim());buf=''}
    }
    if(buf.trim())out.push(buf.trim());
    return out.length?out:[text];
  },
  buildVoices(){
    const sel=$('#tts-voice');
    const zh=this.lang()==='zh';
    const all=speechSynthesis.getVoices().filter(v=>v.lang&&(zh?v.lang.toLowerCase().startsWith('zh'):v.lang.toLowerCase().startsWith('en')));
    if(!all.length){sel.innerHTML='<option value="">默认'+(zh?'中文':'英文')+'音色</option>';return}
    sel.innerHTML=all.map(v=>'<option value="'+esc(v.name)+'">'+esc(v.name.replace(/^Microsoft |^Google /,''))+' · '+esc(v.lang)+'</option>').join('');
    const pref=all.find(v=>zh?/zh[-_]CN/i.test(v.lang):/en[-_]GB/i.test(v.lang));
    if(pref)sel.value=pref.name;
  },
  start(){
    if(!('speechSynthesis' in window)){toast('此浏览器不支持语音合成');return}
    this.refresh();
    this.buildVoices();
    if(!this.sents.length){toast(this.lang()==='zh'?'无中文可朗读（当前模式无译文）':'无英文可朗读');return}
    this.on=true;this.paused=false;this.idx=0;
    document.body.classList.add('tts-reading');
    $('#ttsbar').classList.add('show');
    $('#btn-tts').classList.add('on');
    this.speak();
  },
  speak(){
    if(!this.on||this.idx>=this.sents.length){
      if(this.idx>=this.sents.length&&this.on){toast('选段朗读完毕 ✓');this.stopAll()}
      return
    }
    this.els.forEach(e=>e.classList.remove('tts-on'));
    const el=this.els[this.idx];
    el.classList.add('tts-on');
    el.scrollIntoView({block:'center',behavior:'smooth'});
    $('#tts-prog').textContent=(this.idx+1)+'/'+this.sents.length;
    const u=new SpeechSynthesisUtterance(this.sents[this.idx]);
    const zh=this.lang()==='zh';
    u.lang=zh?'zh-CN':'en-GB';
    u.rate=parseFloat($('#tts-rate').value);
    const v=speechSynthesis.getVoices().find(x=>x.name===$('#tts-voice').value&&x.lang.toLowerCase().startsWith(zh?'zh':'en'));
    if(v)u.voice=v;
    u.onend=()=>{if(this.on&&!this.paused){this.idx++;this.speak()}};
    u.onerror=()=>{if(this.on&&!this.paused){this.idx++;setTimeout(()=>this.speak(),120)}};
    speechSynthesis.speak(u);
  },
  pause(){this.paused=true;speechSynthesis.cancel();$('#tts-play').textContent='▶'},
  resume(){this.paused=false;$('#tts-play').textContent='⏸';this.speak()},
  stopAll(){
    this.on=false;this.paused=false;this.idx=0;
    speechSynthesis.cancel();
    document.body.classList.remove('tts-reading');
    $('#ttsbar').classList.remove('show');
    $('#btn-tts').classList.remove('on');
    this.els.forEach(e=>e.classList.remove('tts-on'));
    $('#tts-play').textContent='▶';
  },
  jump(d){
    speechSynthesis.cancel();
    this.idx=Math.max(0,Math.min(this.sents.length-1,this.idx+d));
    this.paused=false;
    if(this.on)this.speak();
  }
};
if('speechSynthesis' in window){
  speechSynthesis.onvoiceschanged=()=>tts.buildVoices();
}

/* ===== 配置 ===== */
function applyCfg(){
  document.documentElement.dataset.theme=CFG.theme;
  document.documentElement.style.setProperty('--fs',CFG.fs+'px');
  document.documentElement.style.setProperty('--fs-en',(CFG.fs-1)+'px');
  $$('#fs-row .chip').forEach(c=>c.classList.toggle('on',parseInt(c.dataset.fs,10)===CFG.fs));
  $$('#th-row .chip').forEach(c=>c.classList.toggle('on',c.dataset.theme===CFG.theme));
  store.set('cfg',CFG);
}

/* ===== 事件 ===== */
$('#btn-tts').addEventListener('click',()=>{
  if(tts.on&&!tts.paused)tts.pause();
  else if(tts.on&&tts.paused)tts.resume();
  else tts.start();
  $('#tts-play').textContent=(tts.on&&!tts.paused)?'⏸':'▶';
});
$('#tts-play').addEventListener('click',()=>{
  if(!tts.on){tts.start();$('#tts-play').textContent='⏸';return}
  if(tts.paused)tts.resume();else tts.pause();
});
$('#tts-stop').addEventListener('click',()=>tts.stopAll());
$('#tts-prev').addEventListener('click',()=>tts.jump(-1));
$('#tts-next').addEventListener('click',()=>tts.jump(1));
$('#tts-lang').addEventListener('change',e=>{
  ttsLang=e.target.value;store.set('ttslang',ttsLang);
  if(tts.on){tts.stopAll();setTimeout(()=>tts.start(),80)}
});
$('#tts-rate').addEventListener('change',()=>{
  if(tts.on&&!tts.paused){speechSynthesis.cancel();setTimeout(()=>tts.speak(),80)}
});
$('#tts-voice').addEventListener('change',()=>{
  if(tts.on&&!tts.paused){speechSynthesis.cancel();setTimeout(()=>tts.speak(),80)}
});
$('#tts-lang').value=ttsLang;

$('#btn-font').addEventListener('click',e=>{e.stopPropagation();$('#fontpanel').classList.toggle('open')});
document.addEventListener('click',e=>{
  const fp=$('#fontpanel');
  if(fp.classList.contains('open')&&!fp.contains(e.target)&&!$('#btn-font').contains(e.target))fp.classList.remove('open');
});
$$('#fs-row .chip').forEach(c=>c.addEventListener('click',()=>{CFG.fs=parseInt(c.dataset.fs,10);applyCfg()}));
$$('#th-row .chip').forEach(c=>c.addEventListener('click',()=>{CFG.theme=c.dataset.theme;applyCfg()}));
$('#btn-top').addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));

document.addEventListener('keydown',e=>{
  if(e.target.tagName==='SELECT'||e.target.tagName==='INPUT')return;
  if(e.key==='Escape'){if(tts.on)tts.stopAll();$('#fontpanel').classList.remove('open')}
  if(e.key===' '&&tts.on){e.preventDefault();if(tts.paused)tts.resume();else tts.pause()}
});

/* 进度保存（滚动节流） */
let progTimer=null;
window.addEventListener('scroll',()=>{
  if(!CUR||!PAIRS.length)return;
  clearTimeout(progTimer);
  progTimer=setTimeout(()=>{
    const segs=$$('#content .seg[data-i]');
    let cur=0;
    for(const s of segs){if(s.getBoundingClientRect().top<window.innerHeight*0.4)cur=parseInt(s.dataset.i,10);else break}
    saveProg(cur);
  },400);
},{passive:true});

/* ===== 路由 ===== */
function route(){
  const id=location.hash.replace(/^#/,'');
  const book=BOOKS.find(b=>b.id===id);
  if(book){
    CUR=book;
    $('#view-pick').style.display='none';
    $('#view-read').style.display='block';
    $('#modes').style.display='flex';
    renderBook(book);
  }else{
    CUR=null;PAIRS=[];
    tts.stopAll();
    $('#view-read').style.display='none';
    $('#view-pick').style.display='block';
    $('#modes').style.display='none';
    $('#bt-title').textContent='双语阅读 · 艾林翰书斋';
    renderPick();
  }
}
window.addEventListener('hashchange',route);

/* ===== 启动 ===== */
applyCfg();
route();
})();
</script>
</body>
</html>
